        function initPage() {
            renderWeekSelector();
            renderContent(reportData.weeks[0].id);
        }
        
        function renderWeekSelector() {
            const select = document.getElementById('weekSelect');
            select.innerHTML = '';
            reportData.weeks.forEach(week => {
                const option = document.createElement('option');
                option.value = week.id;
                option.textContent = week.label;
                select.appendChild(option);
            });
            if (reportData.weeks.length > 0) select.value = reportData.weeks[0].id;
            select.addEventListener('change', (e) => renderContent(e.target.value));
        }
        
        function renderContent(weekId) {
            const week = reportData.weeks.find(w => w.id === weekId);
            if (!week) return;
            const content = document.getElementById('content');
            const monthLabel = week.month || '';
            
            // 判断是否为两周合并数据（通过label中的日期跨度判断）
            function isTwoWeekPeriod(label) {
                if (!label) return false;
                const match = label.match(/\((\d{2})\.(\d{2})-(\d{2})\.(\d{2})日\)/);
                if (!match) return false;
                const startMonth = parseInt(match[1]);
                const startDay = parseInt(match[2]);
                const endMonth = parseInt(match[3]);
                const endDay = parseInt(match[4]);
                
                let days = 0;
                if (startMonth === endMonth) {
                    days = endDay - startDay;
                } else {
                    days = (30 - startDay) + endDay + (endMonth - startMonth - 1) * 30;
                }
                return days > 8;
            }
            
            // 判断是否为假期多周累计
            function getHolidayTag(label) {
                if (!label) return null;
                // 春节：1月下旬到2月下旬（包括三周合并的情况）
                if (/01\.(2[0-9]|3[01])-02\.(0[1-9]|1[0-9]|2[0-6])/.test(label) || /02\.0[6-9]-02\.2[0-6]/.test(label)) {
                    return '春节假期';
                }
                // 国庆：9月下旬到10月上旬
                if (/09\.2[6-9]-10\.0[1-9]/.test(label) || /09\.2[6-9]-10\.1[0-5]/.test(label)) {
                    return '国庆假期';
                }
                // 五一：4月下旬到5月上旬
                if (/04\.2[5-9]-05\.0[1-8]/.test(label)) {
                    return '五一假期';
                }
                return null;
            }
            
            const isTwoWeek = isTwoWeekPeriod(week.label);
            const holidayTag = getHolidayTag(week.label);
            const highlightClass = isTwoWeek ? 'highlight-yellow' : '';
            
            // 标题显示
            let titleText = '售后工单核心运营数据';
            if (holidayTag) {
                titleText += '<span class="two-week-tag">' + holidayTag + '</span>';
            } else if (isTwoWeek) {
                titleText += '<span class="two-week-tag">两周合并</span>';
            }
            
            let html = '<div class="section-title">' + titleText + '</div><table class="' + highlightClass + '"><thead><tr><th>周期</th><th>' + monthLabel + '售后整体<br>累计周解决率</th><th>累计工单量</th><th>累计客均<br>工单量</th><th class="highlight-green">电话周<br>呼入量</th><th class="highlight-green">电话周<br>接通率</th><th>一线周<br>提单量</th><th class="highlight-green">一线自行<br>处理率</th><th>二线周<br>接单量</th><th>二线周<br>解决率</th><th class="highlight-red">本期P1<br>工单量</th><th class="highlight-red">安全问题</th><th>当年度累计<br>至本周P1工单量</th></tr></thead><tbody>';
            week.coreData.forEach(row => {
                html += '<tr><td class="period-cell">' + row.period + '</td><td>' + row.resolveRate + '</td><td>' + row.totalOrders + '</td><td>' + row.avgOrders + '</td><td class="highlight-green">' + row.phoneCalls + '</td><td class="highlight-green">' + row.phoneConnectRate + '</td><td>' + row.firstLineOrders + '</td><td class="highlight-green">' + row.firstLineResolveRate + '</td><td>' + row.secondLineOrders + '</td><td>' + row.secondLineResolveRate + '</td><td class="highlight-red">' + row.p1Orders + '</td><td class="highlight-red">' + row.securityIssues + '</td><td>' + row.accumulatedP1 + '</td></tr>';
            });
            html += '</tbody></table><div class="section-title">企微专项数据</div><table class="' + highlightClass + '"><thead><tr><th>周期</th><th>企微会话量</th><th>企微来源工单</th><th>P4工单量</th></tr></thead><tbody>';
            week.wechatData.forEach(row => {
                html += '<tr><td class="period-cell">' + row.period + '</td><td>' + row.sessions + '</td><td>' + row.orders + '</td><td>' + row.p4Orders + '</td></tr>';
            });
            html += '</tbody></table>';
            if (week.note) html += '<div class="note"><strong>本周备注：</strong>' + week.note + '</div>';
            html += '<div class="note"><strong>备注：</strong>' + reportData.note + '</div>';
            content.innerHTML = html;
        }
        
        document.addEventListener('DOMContentLoaded', initPage);
    </script>
