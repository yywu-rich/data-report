<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>售后数据抓取工具</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Microsoft YaHei", Arial, sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; margin-bottom: 10px; }
        .subtitle { color: #666; font-size: 14px; margin-bottom: 30px; }
        h2 { color: #1890ff; margin: 25px 0 15px 0; font-size: 18px; }
        .section { background: #fafafa; padding: 20px; border-radius: 6px; margin-bottom: 20px; border-left: 4px solid #1890ff; }
        .form-group { margin: 15px 0; }
        .form-group label { display: inline-block; width: 80px; font-weight: bold; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin: 5px; }
        .btn-primary { background: #1890ff; color: white; }
        .btn-primary:hover { background: #40a9ff; }
        .bookmarklet { display: inline-block; background: #722ed1; color: white; padding: 15px 25px; border-radius: 8px; text-decoration: none; font-weight: bold; margin: 10px 5px; cursor: move; font-size: 16px; }
        .bookmarklet:hover { opacity: 0.9; }
        .wechat { background: #07c160; }
        .phone { background: #ff6a00; }
        .step { margin: 8px 0; color: #666; }
        .info-box { background: #e6f7ff; border: 1px solid #91d5ff; padding: 15px; border-radius: 4px; margin: 15px 0; }
        .period-display { background: #722ed1; color: white; padding: 15px 25px; border-radius: 8px; font-size: 18px; font-weight: bold; display: inline-block; margin: 10px 0; }
        
        .quick-btns { margin: 15px 0; }
        .quick-btn { background: #f0f0f0; border: 1px solid #d9d9d9; padding: 8px 15px; border-radius: 4px; cursor: pointer; margin: 5px; font-size: 13px; }
        .quick-btn:hover { background: #1890ff; color: white; border-color: #1890ff; }
        
        .tips { background: #fffbe6; border: 1px solid #ffe58f; padding: 15px; border-radius: 4px; margin: 10px 0; font-size: 13px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 售后数据抓取工具</h1>
        <p class="subtitle">从网易七鱼后台抓取周期数据</p>

        <!-- 日期选择 -->
        <h2>第一步：选择周期</h2>
        <div class="section">
            <div class="quick-btns">
                <span style="font-weight: bold;">快速选择：</span>
                <button class="quick-btn" onclick="setWeek(-1)">上周</button>
                <button class="quick-btn" onclick="setWeek(0)">本周</button>
            </div>
            
            <div class="form-group">
                <label>开始日期：</label>
                <input type="date" id="startDate" value="">
                <span style="color: #999; margin-left: 10px;">例: 2026-04-24</span>
            </div>
            <div class="form-group">
                <label>结束日期：</label>
                <input type="date" id="endDate" value="">
                <span style="color: #999; margin-left: 10px;">例: 2026-04-30</span>
            </div>
            
            <div class="period-display" id="periodDisplay">请选择日期</div>
            <br>
            <button class="btn btn-primary" onclick="copyPeriod()">📋 复制周期字符串</button>
        </div>

        <!-- 书签 -->
        <h2>第二步：抓取数据</h2>
        <div class="section">
            <div class="info-box">
                <strong>📍 使用方法：</strong><br>
                1. 选择上方日期周期 → 2. 打开七鱼后台 → 3. 点击对应书签 → 4. 复制数据
            </div>
            
            <p style="margin: 15px 0 10px 0; font-weight: bold;">🟣 企微数据（总览页面）：</p>
            <a class="bookmarklet" href="javascript:(function(){var inputs=document.querySelectorAll('input[type=date],input.calendar-input,.date-input,[placeholder*=日期]');var s=document.getElementById('startDate')?document.getElementById('startDate').value:null;var e=document.getElementById('endDate')?document.getElementById('endDate').value:null;if(!s||!e){s=prompt('开始日期(格式20260424):');e=prompt('结束日期(格式20260430):');}if(!s||!e)return;var dateRange=s+' - '+e;var wechatSession=0;document.querySelectorAll('*').forEach(function(el){var text=el.innerText||'';if(text.includes('企业微信')&&text.includes('广东盈世')){var parent=el.closest('div')||el;var allText=parent.innerText||'';var match=allText.match(/企业微信[^0-9]*([0-9]+)个/);if(match)wechatSession=parseInt(match[1]);}});if(wechatSession===0){document.querySelectorAll('*').forEach(function(el){var text=el.innerText||'';var match=text.match(/([0-9]+)个/);if(match&&text.includes('企业微信')&&text.includes('广东盈世')){wechatSession=parseInt(match[1]);}});}var result='企业微信-客户服务-广东盈世计算机科技有限公司\n'+wechatSession+'个\n\n周期: '+dateRange;alert('企微数据已复制！\n\n'+result);navigator.clipboard.writeText(result);})();">🟣 企微数据</a>
            
            <p style="margin: 15px 0 10px 0; font-weight: bold;">🟠 电话数据（呼叫统计页面）：</p>
            <a class="bookmarklet phone" href="javascript:(function(){var inputs=document.querySelectorAll('input[type=date],input.calendar-input,.date-input,[placeholder*=日期]');var s=document.getElementById('startDate')?document.getElementById('startDate').value:null;var e=document.getElementById('endDate')?document.getElementById('endDate').value:null;if(!s||!e){s=prompt('开始日期(格式20260424):');e=prompt('结束日期(格式20260430):');}if(!s||!e)return;var dateRange=s+' - '+e;var callIn=0,connectRate='0%';document.querySelectorAll('table').forEach(function(t){t.querySelectorAll('tr').forEach(function(r){var cells=r.querySelectorAll('td,th');cells.forEach(function(c,i){var txt=c.innerText.trim();if((txt.includes('呼入')||txt.includes('接入'))&&!txt.includes('率')&&!txt.includes('%')){var nc=cells[i+1];if(nc){var v=nc.innerText.replace(/[^0-9]/g,'');if(v)callIn=parseInt(v);}}if(txt.includes('接通率')){var nc=cells[i+1];if(nc)connectRate=nc.innerText.trim();}});});});if(callIn===0){document.querySelectorAll('*').forEach(function(el){var txt=el.innerText||'';var m=txt.match(/(\d+)[^%]*?(接通率|接入率)[^0-9]*([0-9.]+%)?/);if(m){if(m[1]&&callIn===0)callIn=parseInt(m[1]);if(m[3])connectRate=m[3];}});}var result='电话数据:\n呼入量: '+callIn+'\n接通率: '+connectRate+'\n\n周期: '+dateRange;alert('电话数据已复制！\n\n'+result);navigator.clipboard.writeText(result);})();">🟠 电话数据</a>
            
            <div class="tips">
                <strong>💡 提示：</strong>书签会先尝试读取页面上设置的日期，如果读取失败会弹出输入框
            </div>
        </div>
    </div>

    <script>
        function formatDate(date) {
            return date.toISOString().split('T')[0];
        }
        
        function setWeek(offset) {
            const today = new Date();
            // 找到本周六
            const dayOfWeek = today.getDay();
            const daysToSat = dayOfWeek === 6 ? 0 : (dayOfWeek === 0 ? -1 : 6 - dayOfWeek);
            
            if (offset === 0) {
                // 本周
                const sat = new Date(today);
                sat.setDate(today.getDate() + daysToSat);
                const sun = new Date(sat);
                sun.setDate(sat.getDate() - 6);
                document.getElementById('startDate').value = formatDate(sun);
                document.getElementById('endDate').value = formatDate(sat);
            } else {
                // 上周
                const sat = new Date(today);
                sat.setDate(today.getDate() + daysToSat - 7);
                const sun = new Date(sat);
                sun.setDate(sat.getDate() - 6);
                document.getElementById('startDate').value = formatDate(sun);
                document.getElementById('endDate').value = formatDate(sat);
            }
            updatePeriod();
        }
        
        function updatePeriod() {
            const start = new Date(document.getElementById('startDate').value);
            const end = new Date(document.getElementById('endDate').value);
            
            if (isNaN(start.getTime()) || isNaN(end.getTime())) {
                document.getElementById('periodDisplay').textContent = '请选择日期';
                return;
            }
            
            const sm = start.getMonth() + 1;
            const sd = start.getDate();
            const em = end.getMonth() + 1;
            const ed = end.getDate();
            const yr = start.getFullYear().toString().slice(-2);
            
            const period = `${yr}年(${sm}.${sd}-${em}.${ed}日)`;
            document.getElementById('periodDisplay').textContent = period;
            
            // 同时设置给window对象，供书签读取
            window._selectedStartDate = document.getElementById('startDate').value;
            window._selectedEndDate = document.getElementById('endDate').value;
        }
        
        function copyPeriod() {
            const period = document.getElementById('periodDisplay').textContent;
            if (period === '请选择日期') {
                alert('请先选择日期');
                return;
            }
            navigator.clipboard.writeText(period);
            alert('已复制：' + period);
        }
        
        // 初始化
        document.getElementById('startDate').addEventListener('change', updatePeriod);
        document.getElementById('endDate').addEventListener('change', updatePeriod);
        
        // 默认选择上周
        setWeek(-1);
    </script>
</body>
</html>
